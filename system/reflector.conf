# Weekly high-throughput Arch mirror selection for India/Asia.
# Keep only synchronized HTTPS mirrors, measure their download rate locally,
# and retain enough fallbacks without making Pacman walk a long stale list.

--save /etc/pacman.d/mirrorlist
--protocol https
--country India,Singapore,Japan,South_Korea,Hong_Kong
--age 6
--latest 30
--sort rate
--number 12
--connection-timeout 3
--download-timeout 8
