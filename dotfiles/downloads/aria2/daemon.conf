# Persistent aria2 queue for large direct downloads and public torrents.
# The launcher injects a private RPC secret into a generated runtime copy.

dir=__HOME__/storage/anime
input-file=__HOME__/.local/state/aria2/session
save-session=__HOME__/.local/state/aria2/session
save-session-interval=60
force-save=true
continue=true

max-concurrent-downloads=8
split=16
max-connection-per-server=16
min-split-size=4M
disk-cache=128M
# The download volume may be NTFS/FUSE, where falloc is not reliable.
file-allocation=none

connect-timeout=10
timeout=60
max-tries=10
retry-wait=2
max-file-not-found=3
always-resume=true
auto-file-renaming=true
allow-overwrite=false
remote-time=true
content-disposition-default-utf8=true
check-certificate=true
check-integrity=true

enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-allow-origin-all=false

listen-port=6881
dht-listen-port=6881
enable-dht=true
enable-dht6=true
enable-peer-exchange=true
bt-enable-lpd=true
bt-max-peers=80
bt-detach-seed-only=true
bt-save-metadata=true
seed-ratio=1.0
seed-time=120

console-log-level=notice
summary-interval=0
download-result=full
max-download-result=1000
