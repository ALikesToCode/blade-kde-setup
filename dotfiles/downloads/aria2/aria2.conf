# High-throughput interactive downloads. makepkg has its own isolated aria2
# options in ~/.makepkg.conf and intentionally does not read this file.

dir=__HOME__/Downloads
continue=true
max-concurrent-downloads=8
split=8
max-connection-per-server=8
min-split-size=1M
file-allocation=falloc
disk-cache=64M

connect-timeout=10
timeout=60
max-tries=10
retry-wait=2
lowest-speed-limit=10K
max-file-not-found=3

check-certificate=true
check-integrity=true
remote-time=true
auto-file-renaming=true
allow-overwrite=false
content-disposition-default-utf8=true

console-log-level=warn
summary-interval=1
download-result=full
