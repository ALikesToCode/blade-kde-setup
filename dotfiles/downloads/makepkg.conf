# High-throughput AUR source downloads.
#
# Pacman repository packages continue to use libalpm's secure parallel
# downloader. makepkg uses aria2 only for HTTP(S)/FTP source files, splitting
# large files across up to eight connections while preserving TLS validation,
# resume support, and makepkg's normal checksum/signature verification.

DLAGENTS=(
  'file::/usr/bin/curl -qgC - -o %o %u'
  'ftp::/usr/bin/aria2c --no-conf=true --continue=true --max-tries=5 --retry-wait=2 --max-connection-per-server=8 --split=8 --min-split-size=1M --file-allocation=none --auto-file-renaming=false --allow-overwrite=true --summary-interval=0 --console-log-level=warn --download-result=hide --out=%o %u'
  'http::/usr/bin/aria2c --no-conf=true --continue=true --max-tries=5 --retry-wait=2 --max-connection-per-server=8 --split=8 --min-split-size=1M --file-allocation=none --auto-file-renaming=false --allow-overwrite=true --summary-interval=0 --console-log-level=warn --download-result=hide --out=%o %u'
  'https::/usr/bin/aria2c --no-conf=true --continue=true --max-tries=5 --retry-wait=2 --max-connection-per-server=8 --split=8 --min-split-size=1M --file-allocation=none --auto-file-renaming=false --allow-overwrite=true --summary-interval=0 --console-log-level=warn --download-result=hide --out=%o %u'
  'rsync::/usr/bin/rsync --no-motd -z %u %o'
  'scp::/usr/bin/scp -C %u %o'
)
