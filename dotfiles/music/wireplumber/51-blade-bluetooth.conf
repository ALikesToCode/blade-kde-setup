# Blade Music: Bluetooth headphone settings for WirePlumber 0.5.
wireplumber.settings = {
  # An app opening the microphone (a browser tab, a call) otherwise flips the
  # headphones to the hands-free profile: mono, 16 kHz, music sounds like a
  # phone call. Calls use the laptop microphone instead; pick the headset
  # profile by hand when its microphone is needed.
  bluetooth.autoswitch-to-headset-profile = false

  # Mute the speakers when the headphones disconnect or run flat, so music
  # does not carry on out loud in a quiet room.
  device.routes.mute-on-bluetooth-playback-removed = true
}
