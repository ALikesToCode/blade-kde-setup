music_directory     "~/storage/music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
sticker_file        "~/.local/share/mpd/sticker.sql"
state_file          "~/.local/state/mpd/state"
log_file            "syslog"

# The socket gives myMPD the music directory (covers, library view); TCP is
# loopback-only for mpc and mpd-mpris.
bind_to_address     "~/.local/state/mpd/socket"
bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
restore_paused      "yes"
# Cached songs are singles from different uploads, tagged per song by
# blade-music loudness; album gain would have nothing to group.
replaygain          "track"
follow_outside_symlinks "no"

audio_output {
    type "pipewire"
    name "PipeWire"
}
