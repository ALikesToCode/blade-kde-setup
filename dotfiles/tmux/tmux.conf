# Tmux 3.6 — practical defaults with the Artix dark blue/green palette.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g status-interval 5
set -g status-position bottom

set -g status-style "bg=#05070a,fg=#9eacba"
set -g status-left-length 30
set -g status-left "#[fg=#50fa7b,bold]  #S #[fg=#263545]│"
set -g status-right "#[fg=#263545]│ #[fg=#38bdf8]%Y-%m-%d #[fg=#50fa7b]%H:%M  "
set -g window-status-format " #[fg=#73869a]#I:#W "
set -g window-status-current-format " #[fg=#05070a,bg=#38bdf8,bold] #I:#W #[default]"
set -g pane-border-style "fg=#263545"
set -g pane-active-border-style "fg=#38bdf8"
set -g message-style "fg=#05070a,bg=#50fa7b,bold"
set -g mode-style "fg=#05070a,bg=#38bdf8,bold"

# New panes inherit the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
