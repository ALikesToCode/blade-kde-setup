# MPV 0.41 — high-quality KDE Wayland profile for the 4K/120 Hz displays.

# Modern libplacebo renderer with NVIDIA hardware decoding. hwdec=auto picks
# Vulkan Video, whose decode thread hung in the 615 driver 44 min into a movie
# (frozen picture, then KWin killed the window); NVDEC is the stable path.
profile=high-quality
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
# Other GPUs fall back to VA-API in this order.
hwdec=nvdec,vaapi
target-colorspace-hint=auto

# Clean scaling and color processing. At 120 Hz, 24/30/60 fps content maps
# evenly to the display and interpolation stays idle; 25/50 fps (4.8x/2.4x)
# can't be retimed, so it is blended smoothly instead of juddering.
video-sync=display-resample
interpolation=yes
tscale=oversample
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes

# Match the Artix Dark Rounded desktop instead of showing gray letterboxing.
background-color="#05070a"
border-background=color
autofit-larger=90%x90%
cursor-autohide=800

# Resume cleanly, remember recent files (g-h), and build a playlist from
# neighboring media files.
save-position-on-quit=yes
save-watch-history=yes
autocreate-playlist=same
audio-file-auto=fuzzy
audio-file-paths=audio,Audio
sub-auto=fuzzy
sub-file-paths=sub,subs,subtitles,Subtitles

# Readable subtitles and OSD on both the 4K and ultrawide displays.
slang=en,eng
sub-font="Noto Sans"
sub-font-size=40
sub-color="#fff4f8ff"
sub-outline-color="#ff05070a"
sub-outline-size=2.2
sub-back-color="#8005070a"
sub-shadow-offset=1.2
sub-pos=96
osd-color="#ffeaf2ff"
osd-outline-color="#ff05070a"
osd-outline-size=1.8
osd-font-size=30
osd-duration=1200
osd-on-seek=bar
osd-bar-align-y=0.88

# Local files stream straight from the SSDs. cache=auto misdetects the NTFS
# (fuseblk) storage drive as slow media and buffers whole movies into RAM, so
# the RAM cache is enabled only for URLs by the [network-stream] profile below.
cache=no
network-timeout=20

# Highest available online quality, with parallel DASH/HLS fragments.
ytdl=yes
ytdl-format=bestvideo*+bestaudio/best
ytdl-raw-options=concurrent-fragments=8

# Lossless, color-tagged screenshots.
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes
screenshot-directory=__HOME__/Pictures/Screenshots

# Profiles must stay at the end: every option below a [section] belongs to it.

# Seekable RAM buffer for online video only; reverted for the next local file.
[network-stream]
profile-cond=get("path", ""):find("^%a[%w+.-]*://") and not get("path", ""):find("^file://")
profile-restore=copy
cache=yes
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=512MiB

